# =============================================================================
# AgentDesk RAG Platform — Docker Compose
# =============================================================================
# Tüm servisleri başlatmak için: docker compose up -d
# GPU profili ile vLLM dahil: docker compose --profile gpu up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # AgentDesk — Ana FastAPI sunucusu
  # ---------------------------------------------------------------------------
  agentdesk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentdesk
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.env:/app/.env:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - agentdesk-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL — Müşteri veritabanı
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agentdesk-postgres
    environment:
      POSTGRES_DB: agentdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ./db/seed:/docker-entrypoint-initdb.d/02-seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentdesk-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Qdrant — Vektör veritabanı
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentdesk-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - agentdesk-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vLLM — Yerel LLM çıkarım sunucusu (GPU profili ile opsiyonel)
  # Kullanım: docker compose --profile gpu up -d
  # ---------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:latest
    container_name: agentdesk-vllm
    profiles:
      - gpu
    ports:
      - "8080:8000"
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-32B}
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-32B}
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - agentdesk-net
    restart: unless-stopped

# =============================================================================
# Volumes — Kalıcı veri depolama
# =============================================================================
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  agentdesk-net:
    driver: bridge
